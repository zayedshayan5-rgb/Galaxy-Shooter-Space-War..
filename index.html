<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALAXY WARFARE: MASTER ENGINE v3.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        /* --- CSS STYLING SECTION --- */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif;
            user-select: none; touch-action: none;
        }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px; background: linear-gradient(to bottom, rgba(0, 210, 255, 0.25), transparent);
        }

        .stat-box { display: flex; flex-direction: column; }
        .label { font-size: 11px; color: #00d2ff; letter-spacing: 2px; font-weight: 700; }
        .value { font-size: 26px; color: #fff; font-weight: 900; text-shadow: 0 0 12px #00d2ff; }

        .shield-bar-outer {
            width: 160px; height: 12px; background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00d2ff; border-radius: 6px; margin-top: 6px; overflow: hidden;
        }
        #shield-fill {
            width: 100%; height: 100%; background: linear-gradient(90deg, #00d2ff, #00f2ff);
            box-shadow: 0 0 15px #00d2ff; transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #boss-hud {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            width: 85%; opacity: 0; transition: opacity 0.8s ease-in-out;
        }
        .boss-hp-outer {
            width: 100%; height: 18px; background: rgba(255, 0, 0, 0.15);
            border: 2px solid #ff3e3e; border-radius: 10px; position: relative;
        }
        #boss-hp-inner {
            width: 100%; height: 100%; background: linear-gradient(90deg, #7b0000, #ff0000);
            box-shadow: 0 0 20px #ff0000;
        }

        .notification-system {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .evo-msg { font-size: 45px; font-weight: 900; color: #00d2ff; text-shadow: 0 0 35px #00d2ff; margin: 0; }

        .game-over-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 500;
        }

        .btn-restart {
            margin-top: 40px; padding: 18px 60px; background: transparent;
            border: 3px solid #00d2ff; color: #00d2ff; font-weight: 900;
            font-size: 18px; cursor: pointer; border-radius: 8px; transition: 0.4s;
            font-family: 'Orbitron'; letter-spacing: 3px;
        }
        .btn-restart:hover { background: #00d2ff; color: #000; box-shadow: 0 0 40px #00d2ff; }

        #lobby {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
        }

        #play-btn {
            padding: 20px 50px; font-size: 30px; font-weight: bold;
            background: #00d2ff; border: none; border-radius: 15px; color: white; cursor: pointer;
        }

        #shop-btn {
            margin-top: 20px; padding: 15px 40px; font-size: 22px; font-weight: bold;
            background: #FFD700; border: none; border-radius: 15px; color: black;
            box-shadow: 0 0 20px #FFD700; cursor: pointer;
        }

        #shop-menu {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #111; padding: 40px;
            border: 3px solid #FFD700; border-radius: 20px; z-index: 1000;
            text-align: center; max-height: 80%; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header">
            <div class="stat-box">
                <span class="label">MISSION DISTANCE</span>
                <span id="dist-val" class="value">0000</span>
            </div>
            <div class="stat-box">
                <span class="label">COINS</span>
                <span id="coin-ui" class="value">0</span>
            </div>
            <div class="stat-box" style="align-items: flex-end;">
                <span id="pilot-rank" class="label">RANK: ROOKIE</span>
                <div class="shield-bar-outer">
                    <div id="shield-fill"></div>
                </div>
            </div>
        </div>

        <div id="boss-hud">
            <div class="label" style="text-align:center; color:#ff3e3e; margin-bottom:6px; font-size:14px;">ULTIMATE OVERLORD</div>
            <div class="boss-hp-outer">
                <div id="boss-hp-inner"></div>
            </div>
        </div>

        <div id="evo-notify" class="notification-system">
            <p class="evo-msg">SYSTEM EVOLVED</p>
            <p style="color: #fff; letter-spacing: 6px;">LEVEL UPGRADED</p>
        </div>
    </div>

    <div id="death-screen" class="game-over-modal">
        <h1 style="color: #ff3e3e; font-size: 60px; margin-bottom: 0;">TERMINATED</h1>
        <p style="color: #fff; font-size: 20px; letter-spacing: 4px; margin-top: 10px;">FINAL DISTANCE: <span id="final-res">0</span>M</p>
        <button class="btn-restart" onclick="location.reload()">RE-INITIALIZE</button>
    </div>

    <div id="lobby">
        <h1 id="lobby-coins" style="color:white;">COINS: 0</h1>
        <button id="play-btn" onclick="startGame()">PLAY</button>
        <button id="shop-btn" onclick="openShop()">SHOP</button>
    </div>

    <div id="shop-menu">
        <h1 style="color:#FFD700;">SHOP</h1>
        
        <div id="hp-upgrade-box" style="margin-top:20px; padding:20px; border:2px solid #00d2ff; border-radius:15px; color:white;">
            <h2 id="hp-title">HP UPGRADE LVL 1</h2>
            <p id="hp-bonus">+50 HP</p>
            <p id="hp-price">PRICE: 1,000 COINS</p>
            <button onclick="buyHpUpgrade()" style="padding:10px 20px; background:#00d2ff; border:none; border-radius:10px; font-weight:bold; color:white; cursor:pointer;">BUY</button>
        </div>

        <div id="coin-upgrade-box" style="margin-top:20px; padding:20px; border:2px solid #FFD700; border-radius:15px; color:white;">
            <h2 id="coin-title">COIN BOOST LVL 1</h2>
            <p id="coin-bonus">2x COINS</p>
            <p id="coin-price">PRICE: 50 COINS</p>
            <button onclick="buyCoinUpgrade()" style="padding:10px 20px; background:#FFD700; border:none; border-radius:10px; font-weight:bold; color:black; cursor:pointer;">BUY</button>
        </div>

        <button onclick="closeShop()" style="margin-top:25px; padding:15px 35px; font-size:20px; font-weight:bold; border:none; border-radius:15px; background:#ff3333; color:white; cursor:pointer;">CLOSE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
    /**
     * GALAXY WARFARE MEGA ENGINE
     * ALL-IN-ONE MASTER SCRIPT
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Global Constants
    const EVO_TARGET = 1500;
    const BOSS_TARGET = 3000;
    const MAX_LVL = 6;

    // Game Variables
    let w, h, dist = 0, frames = 0, isLive = false, shake = 0;
    let zGold = parseInt(localStorage.getItem("coins")) || 0;
    
    // Update UI initially
    document.getElementById("lobby-coins").innerText = "COINS: " + zGold;
    document.getElementById("coin-ui").innerText = zGold;
    
    let pLvl = 1, bLvl = 1, PHP = 100;

    // --- SHOP VARIABLES (FIXED) ---
    // Ager bar ekhane 'let' abar dewa hoyechilo, tai crash korto.
    // Ekhon shudhu value load kora hocche.
    let coinLevel = parseInt(localStorage.getItem("coinLevel")) || 1;
    let coinMulti = parseInt(localStorage.getItem("coinMulti")) || 2;
    let coinPrice = parseInt(localStorage.getItem("coinPrice")) || 50;

    // Update Shop UI with saved values
    document.getElementById("coin-title").innerText = "⚡ COIN BOOST LVL " + coinLevel;
    document.getElementById("coin-bonus").innerText = coinMulti + "x COINS";
    document.getElementById("coin-price").innerText = "PRICE: " + coinPrice.toLocaleString() + " COINS";

    // Entity Collections
    let stars = [], particles = [], pBullets = [], eBullets = [], enemies = [], activeBoss = null;

    // --- AUDIO ENGINE ---
    // Note: Jodi sound file na thake, game shobdo charai cholbe (Crash korbe na)
    const Sfx = {
        bgm: new Audio('skybound_pursuit.mp3'), 
        laser: new Audio('hull_breach.mp3'),
        hit: new Audio('hull_breach_protocol.mp3'),
        boom: new Audio('titanium_hull_stress.mp3')
    };
    Sfx.bgm.loop = true;
    Sfx.bgm.volume = 0.4;

    function triggerSfx(sound){
        if(!sound) return;
        sound.currentTime = 0;
        sound.play().catch(()=>{});
    }

    // Asset Loader
    const Ing = { p: [], b: [], e: [], ready: false };
    // Images load logic (Simplified for stability)
    
    // --- CLASSES ---
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 12;
            this.vy = (Math.random() - 0.5) * 12;
            this.life = 1.0; this.color = color;
            this.size = Math.random() * 3 + 2;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.025; }
        draw() {
            ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    class Star {
        constructor() {
            this.x = Math.random() * innerWidth;
            this.y = Math.random() * innerHeight;
            this.sz = Math.random() * 2.5;
            this.sp = Math.random() * 4 + 1;
        }
        update() { this.y += this.sp; if(this.y > h) this.y = -10; }
        draw() { ctx.fillStyle = "#fff"; ctx.fillRect(this.x, this.y, this.sz, this.sz); }
    }

    const Hero = {
        x: 0, y: 0, tx: 0, ty: 0, w: 50, h: 60, // Adjusted size
        update() {
            this.x += (this.tx - this.x) * 0.16;
            this.y += (this.ty - this.y) * 0.16;
            if(frames % Math.max(5, 12 - pLvl) === 0) this.fire();
        },
        fire() {
            // triggerSfx(Sfx.laser);
            pBullets.push(new Projectile(this.x, this.y - 45, 0, -22, 2 + pLvl));
        },
        draw() {
            // Simple Player Ship Graphic
            ctx.shadowBlur = 20; ctx.shadowColor = "#00d2ff";
            ctx.fillStyle = "#00d2ff";
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - 30);
            ctx.lineTo(this.x - 25, this.y + 30);
            ctx.lineTo(this.x + 25, this.y + 30);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    };

    class Projectile {
        constructor(x, y, vx, vy, dmg, ultra = false) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.dmg = dmg; this.ultra = ultra;
        }
        update() { this.x += this.vx; this.y += this.vy; }
        draw() {
            ctx.fillStyle = this.ultra ? "#FFD700" : "#00f2fe";
            ctx.fillRect(this.x - 2.5, this.y - 10, 5, 20);
        }
    }

    class Enemy {
        constructor(lvl) {
            this.x = Math.random() * (w - 80) + 40; this.y = -80;
            this.lvl = lvl; this.hp = 4 * lvl;
            this.sp = 2.8 + (lvl * 0.45); this.w = 50; this.h = 50;
        }
        update() { this.y += this.sp; }
        draw() {
            ctx.fillStyle = "#ff3e3e";
            ctx.beginPath();
            ctx.moveTo(this.x, this.y + 25);
            ctx.lineTo(this.x - 25, this.y - 25);
            ctx.lineTo(this.x + 25, this.y - 25);
            ctx.fill();
        }
    }

    // --- CORE FUNCTIONS ---
    function explode(x, y, color, qty = 10) {
        shake = 10;
        for(let i=0; i<qty; i++) particles.push(new Particle(x, y, color));
    }

    function refreshUI() {
        const f = document.getElementById('shield-fill');
        f.style.width = Math.max(0, PHP) + "%";
        f.style.background = PHP < 35 ? "linear-gradient(90deg, #7b0000, #ff0000)" : "linear-gradient(90deg, #00d2ff, #00f2fe)";
    }

    function dmgHero(amt) {
        PHP -= amt; shake = 14; refreshUI();
        // triggerSfx(Sfx.hit);
        if(PHP <= 0) {
            isLive = false;
            document.getElementById('death-screen').style.display = 'flex';
            document.getElementById('final-res').innerText = dist;
            document.querySelector("canvas").style.display = "none"; // Hide canvas on death
        }
    }

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        Hero.x = Hero.tx = w / 2; Hero.y = Hero.ty = h - 160;
    }

    function init() {
        resize(); 
        document.querySelector("canvas").style.display = "none";
        for(let i=0; i<120; i++) stars.push(new Star());
        
        window.addEventListener('resize', resize);
        
        // Touch Controls
        window.addEventListener('touchmove', e => {
            e.preventDefault(); // Stop scrolling
            Hero.tx = e.touches[0].clientX;
            Hero.ty = e.touches[0].clientY - 65;
        }, {passive: false});

        // Mouse Controls (for PC testing)
        window.addEventListener('mousemove', e => {
            Hero.tx = e.clientX;
            Hero.ty = e.clientY;
        });
    }

    function update() {
        if(!isLive) return;
        frames++; if(frames % 5 === 0) dist++;
        document.getElementById('dist-val').innerText = dist.toString().padStart(4, '0');
        // document.getElementById('coin-ui').innerText = zGold; // Optimized: update only on change

        stars.forEach(s => s.update());
        Hero.update();
        particles.forEach((p, i) => { p.update(); if(p.life <= 0) particles.splice(i, 1); });
        
        // Player Bullets
        pBullets.forEach((b, i) => {
            b.update();
            if(b.y < -50) pBullets.splice(i, 1);
            enemies.forEach((e, ei) => {
                if(Math.hypot(b.x - e.x, b.y - e.y) < 45) {
                    e.hp -= b.dmg; pBullets.splice(i, 1);
                    explode(e.x, e.y, "#FF5722", 3);
                    if(e.hp <= 0) {
                        enemies.splice(ei, 1);
                        explode(e.x, e.y, "#FFD700", 15);
                        zGold += coinMulti;
                        localStorage.setItem("coins", zGold);
                        document.getElementById('coin-ui').innerText = zGold; // Update UI
                    }
                }
            });
        });

        // Enemy Spawner
        if(frames % 45 === 0) enemies.push(new Enemy(pLvl));
        
        // Enemy Logic
        enemies.forEach((e, i) => {
            e.update();
            if(e.y > h + 100) enemies.splice(i, 1);
            // Collision with Player
            if(Math.hypot(e.x - Hero.x, e.y - Hero.y) < 55) {
                enemies.splice(i, 1); 
                dmgHero(25); 
                explode(Hero.x, Hero.y, "#ff0000", 20);
            }
        });

        if(shake > 0) shake *= 0.92;
    }

    function render() {
        if(!isLive) return;
        ctx.save();
        if(shake > 1.2) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        ctx.clearRect(0, 0, w, h);
        
        stars.forEach(s => s.draw());
        particles.forEach(p => p.draw());
        pBullets.forEach(b => b.draw());
        enemies.forEach(e => e.draw());
        Hero.draw();

        ctx.restore();
    }

    function run() { update(); render(); requestAnimationFrame(run); }
    init(); run();

    function startGame() {
        isLive = true;
        // Reset Stats for new game
        dist = 0;
        frames = 0;
        PHP = 100 + (hpLevel > 1 ? (hpLevel-1)*50 : 0); // Apply HP Upgrades
        if(hpLevel == 6) PHP = 300; // Max level bonus
        
        refreshUI();
        
        enemies = [];
        pBullets = [];
        particles = [];

        document.getElementById("lobby").style.display = "none";
        document.getElementById("death-screen").style.display = "none";
        document.querySelector("canvas").style.display = "block";
        // if(Sfx.bgm.paused) Sfx.bgm.play();
    }

    function openShop() { document.getElementById("shop-menu").style.display = "block"; }
    function closeShop() { document.getElementById("shop-menu").style.display = "none"; }

    // --- UPGRADE SYSTEM ---
    let hpLevel = parseInt(localStorage.getItem("hpLevel")) || 1;
    const hpData = [
        {price: 1000, hp: 50},
        {price: 10000, hp: 50},
        {price: 100000, hp: 50},
        {price: 1000000, hp: 100},
        {price: 1000000000, hp: 200}
    ];

    // Update HP Title on Load
    if(hpLevel <= 5) {
         document.getElementById("hp-title").innerText = "❤ HP UPGRADE LVL " + hpLevel;
         document.getElementById("hp-price").innerText = "PRICE: " + hpData[hpLevel-1].price.toLocaleString() + " COINS";
    } else {
         document.getElementById("hp-title").innerText = "MAX HP REACHED";
         document.getElementById("hp-price").innerText = "COMPLETED";
    }

    function buyHpUpgrade(){
        if(hpLevel > 5) { alert("MAX LEVEL REACHED!"); return; }
        let current = hpData[hpLevel - 1];
        
        if(zGold >= current.price){
            zGold -= current.price;
            localStorage.setItem("coins", zGold);
            
            hpLevel++;
            localStorage.setItem("hpLevel", hpLevel);

            alert("SUCCESS! HP UPGRADED!");
            document.getElementById("coin-ui").innerText = zGold;
            document.getElementById("lobby-coins").innerText = "COINS: " + zGold;
            
            if(hpLevel <= 5){
                document.getElementById("hp-title").innerText = "❤ HP UPGRADE LVL " + hpLevel;
                document.getElementById("hp-price").innerText = "PRICE: " + hpData[hpLevel-1].price.toLocaleString() + " COINS";
            } else {
                document.getElementById("hp-title").innerText = "MAX HP REACHED";
                document.getElementById("hp-price").innerText = "COMPLETED";
            }

        } else {
            alert("NOT ENOUGH COINS!");
        }
    }

    function buyCoinUpgrade(){
        if(zGold >= coinPrice){
            zGold -= coinPrice;
            coinLevel++;
            coinMulti++;
            coinPrice *= 2;

            localStorage.setItem("coinMulti", coinMulti);
            localStorage.setItem("coinLevel", coinLevel);
            localStorage.setItem("coinPrice", coinPrice);
            localStorage.setItem("coins", zGold);

            alert("COIN BOOST UPGRADED TO " + coinMulti + "x");
            document.getElementById("coin-ui").innerText = zGold;
            document.getElementById("lobby-coins").innerText = "COINS: " + zGold;
            
            // Update Shop UI
            document.getElementById("coin-title").innerText = "⚡ COIN BOOST LVL " + coinLevel;
            document.getElementById("coin-bonus").innerText = coinMulti + "x COINS";
            document.getElementById("coin-price").innerText = "PRICE: " + coinPrice.toLocaleString() + " COINS";
        } else {
            alert("NOT ENOUGH COINS!");
        }
    }
    </script>
    </body>
</html>
